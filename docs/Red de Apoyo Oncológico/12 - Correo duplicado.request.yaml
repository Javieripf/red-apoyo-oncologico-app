$kind: http-request
url: "{{base_url}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Usuario Prueba G10",
      "correo": "{{demo_email}}",
      "password": "{{demo_password}}",
      "tipoRelacion": "familiar"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 12000
