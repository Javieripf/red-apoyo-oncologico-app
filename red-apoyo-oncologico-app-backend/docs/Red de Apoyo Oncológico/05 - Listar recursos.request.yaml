$kind: http-request
url: "{{base_url}}/recursos"
method: GET
headers:
  Authorization: Bearer {{user_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test('Recursos son array',()=>pm.expect(pm.response.json().data).to.be.an('array'));
    language: text/javascript
order: 5000
