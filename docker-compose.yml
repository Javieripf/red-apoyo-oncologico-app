services:
  db:
    image: postgres:16-alpine
    container_name: red_apoyo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-red_apoyo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/SQL/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/SQL/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-red_apoyo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: red_apoyo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-red_apoyo}
      JWT_SECRET: ${JWT_SECRET:-clave_secreta_super_segura_para_docker_32_caracteres}
      JWT_EXPIRES_IN: 2h
      FRONTEND_ORIGIN: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@redapoyo.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass1234}
      ADMIN_NAME: Administrador
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    container_name: red_apoyo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  postgres_data: